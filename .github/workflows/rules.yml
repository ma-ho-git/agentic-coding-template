name: Rules

on:
  push:
  pull_request:
    branches: [main]

jobs:
  rules:
    name: Rule checks at the second anchor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The pushed or proposed range; fall back to the last commit when the
      # previous ref is unreachable (new branch, force-push, first commit).
      - name: Determine commit range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q origin "${{ github.event.pull_request.base.ref }}"
            echo "spec=origin/${{ github.event.pull_request.base.ref }}...HEAD" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            echo "spec=${{ github.event.before }}..HEAD" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify HEAD~1 >/dev/null 2>&1; then
            echo "spec=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "spec=--all" >> "$GITHUB_OUTPUT"
          fi

      # Same command as the local pre-commit choke point - no separate rule set.
      - name: Run every rule check over the range
        run: |
          if [ "${{ steps.range.outputs.spec }}" = "--all" ]; then
            python3 tools/check_all.py --all
          else
            python3 tools/check_all.py --range "${{ steps.range.outputs.spec }}"
          fi

      # A guardrail change must never slip through quietly. Loud, not blocking:
      # evolving the guardrails is legitimate, changing them unnoticed is not.
      - name: Make guardrail changes loud
        run: |
          if [ "${{ steps.range.outputs.spec }}" = "--all" ]; then
            exit 0
          fi
          changed=$(git diff --name-only "${{ steps.range.outputs.spec }}" -- \
            .claude/hooks .claude/settings.json .claude/rules/guardrails.md \
            tools/check_all.py tools/install_hooks.py tools/ci_check.py \
            .github/workflows)
          if [ -n "$changed" ]; then
            echo "::warning title=Guardrail change::Enforcement files changed in this range - review them deliberately."
            echo "$changed" | while read -r file; do
              echo "::warning file=$file::guardrail file changed"
            done
            {
              echo "### Guardrail files changed"
              echo '```'
              echo "$changed"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Hook and tool test suite
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tests -q
